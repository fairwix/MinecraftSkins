services:
  # База данных (общая для всех)
  postgres:
    image: postgres:15
    container_name: minecraftskins-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${MCS_POSTGRES_PASSWORD:?Set MCS_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: minecraftskins
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - minecraftskins-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  migrator:
    image: ${DOCKER_USERNAME:-local}/minecraft-skins:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: MinecraftSkins.WebAPI/Dockerfile
    command: ["--migrate-only"]
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=minecraftskins;Username=postgres;Password=${MCS_POSTGRES_PASSWORD:?Set MCS_POSTGRES_PASSWORD in .env}
      - Authentication__ApiKeys__0__Key=${MCS_ADMIN_API_KEY:?Set MCS_ADMIN_API_KEY in .env}
      - Authentication__ApiKeys__0__UserId=${MCS_ADMIN_USER_ID:-admin}
      - Authentication__ApiKeys__0__Role=Admin
      - Authentication__ApiKeys__1__Key=${MCS_DEMO_USER_API_KEY:?Set MCS_DEMO_USER_API_KEY in .env}
      - Authentication__ApiKeys__1__UserId=${MCS_DEMO_USER_ID:-demo}
      - Authentication__ApiKeys__1__Role=User
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - minecraftskins-network

  backend1:
    image: ${DOCKER_USERNAME:-local}/minecraft-skins:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: MinecraftSkins.WebAPI/Dockerfile
    container_name: minecraftskins-backend1
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=minecraftskins;Username=postgres;Password=${MCS_POSTGRES_PASSWORD:?Set MCS_POSTGRES_PASSWORD in .env}
      - INSTANCE_ID=backend1   
      - Authentication__ApiKeys__0__Key=${MCS_ADMIN_API_KEY:?Set MCS_ADMIN_API_KEY in .env}
      - Authentication__ApiKeys__0__UserId=${MCS_ADMIN_USER_ID:-admin}
      - Authentication__ApiKeys__0__Role=Admin
      - Authentication__ApiKeys__1__Key=${MCS_DEMO_USER_API_KEY:?Set MCS_DEMO_USER_API_KEY in .env}
      - Authentication__ApiKeys__1__UserId=${MCS_DEMO_USER_ID:-demo}
      - Authentication__ApiKeys__1__Role=User
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - minecraftskins-network

  backend2:
    image: ${DOCKER_USERNAME:-local}/minecraft-skins:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: MinecraftSkins.WebAPI/Dockerfile
    container_name: minecraftskins-backend2
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=minecraftskins;Username=postgres;Password=${MCS_POSTGRES_PASSWORD:?Set MCS_POSTGRES_PASSWORD in .env}
      - INSTANCE_ID=backend2  
      - Authentication__ApiKeys__0__Key=${MCS_ADMIN_API_KEY:?Set MCS_ADMIN_API_KEY in .env}
      - Authentication__ApiKeys__0__UserId=${MCS_ADMIN_USER_ID:-admin}
      - Authentication__ApiKeys__0__Role=Admin
      - Authentication__ApiKeys__1__Key=${MCS_DEMO_USER_API_KEY:?Set MCS_DEMO_USER_API_KEY in .env}
      - Authentication__ApiKeys__1__UserId=${MCS_DEMO_USER_ID:-demo}
      - Authentication__ApiKeys__1__Role=User
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - minecraftskins-network

  backend3:
    image: ${DOCKER_USERNAME:-local}/minecraft-skins:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: MinecraftSkins.WebAPI/Dockerfile
    container_name: minecraftskins-backend3
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=minecraftskins;Username=postgres;Password=${MCS_POSTGRES_PASSWORD:?Set MCS_POSTGRES_PASSWORD in .env}
      - INSTANCE_ID=backend3  
      - Authentication__ApiKeys__0__Key=${MCS_ADMIN_API_KEY:?Set MCS_ADMIN_API_KEY in .env}
      - Authentication__ApiKeys__0__UserId=${MCS_ADMIN_USER_ID:-admin}
      - Authentication__ApiKeys__0__Role=Admin
      - Authentication__ApiKeys__1__Key=${MCS_DEMO_USER_API_KEY:?Set MCS_DEMO_USER_API_KEY in .env}
      - Authentication__ApiKeys__1__UserId=${MCS_DEMO_USER_ID:-demo}
      - Authentication__ApiKeys__1__Role=User
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - minecraftskins-network
  
  backend4:
    image: ${DOCKER_USERNAME:-local}/minecraft-skins:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: MinecraftSkins.WebAPI/Dockerfile
    container_name: minecraftskins-backend4
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=minecraftskins;Username=postgres;Password=${MCS_POSTGRES_PASSWORD:?Set MCS_POSTGRES_PASSWORD in .env}
      - INSTANCE_ID=backend4
      - Authentication__ApiKeys__0__Key=${MCS_ADMIN_API_KEY:?Set MCS_ADMIN_API_KEY in .env}
      - Authentication__ApiKeys__0__UserId=${MCS_ADMIN_USER_ID:-admin}
      - Authentication__ApiKeys__0__Role=Admin
      - Authentication__ApiKeys__1__Key=${MCS_DEMO_USER_API_KEY:?Set MCS_DEMO_USER_API_KEY in .env}
      - Authentication__ApiKeys__1__UserId=${MCS_DEMO_USER_ID:-demo}
      - Authentication__ApiKeys__1__Role=User
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - minecraftskins-network
    
  backend5:
      image: ${DOCKER_USERNAME:-local}/minecraft-skins:${IMAGE_TAG:-dev}
      build:
        context: .
        dockerfile: MinecraftSkins.WebAPI/Dockerfile
      container_name: minecraftskins-backend5
      restart: unless-stopped
      environment:
        - ASPNETCORE_ENVIRONMENT=Production
        - ASPNETCORE_URLS=http://+:80
        - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=minecraftskins;Username=postgres;Password=${MCS_POSTGRES_PASSWORD:?Set MCS_POSTGRES_PASSWORD in .env}
        - INSTANCE_ID=backend5
        - Authentication__ApiKeys__0__Key=${MCS_ADMIN_API_KEY:?Set MCS_ADMIN_API_KEY in .env}
        - Authentication__ApiKeys__0__UserId=${MCS_ADMIN_USER_ID:-admin}
        - Authentication__ApiKeys__0__Role=Admin
        - Authentication__ApiKeys__1__Key=${MCS_DEMO_USER_API_KEY:?Set MCS_DEMO_USER_API_KEY in .env}
        - Authentication__ApiKeys__1__UserId=${MCS_DEMO_USER_ID:-demo}
        - Authentication__ApiKeys__1__Role=User
      depends_on:
        postgres:
          condition: service_healthy
        migrator:
          condition: service_completed_successfully
      networks:
        - minecraftskins-network
    
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: minecraftskins-nginx
    restart: unless-stopped
    ports:
      - "80:80"      # HTTP (будет редиректить на HTTPS)
      - "443:443"    # HTTPS (основной вход)
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro   # конфиг Nginx
      - ./frontend:/usr/share/nginx/html:ro           # статика фронтенда 
      - ./nginx/static:/usr/share/nginx/static:ro     # статика для теста
    depends_on:
      - backend1
      - backend2
      - backend3
      - backend4
      - backend5
    networks:
      - minecraftskins-network

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: minecraftskins-nginx-exporter
    command: -nginx.scrape-uri http://nginx:9113/stub_status
    networks:
      - minecraftskins-network
    depends_on:
      - nginx
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: minecraftskins-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - minecraftskins-network
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: minecraftskins-loki
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - minecraftskins-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: minecraftskins-promtail
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - minecraftskins-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: minecraftskins-grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "127.0.0.1:3000:3000"
      
    networks:
      - minecraftskins-network
    restart: unless-stopped
networks:
  minecraftskins-network:
    driver: bridge

volumes:
  postgres_data:
