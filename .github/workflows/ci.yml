name: CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build MinecraftSkins.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test MinecraftSkins.sln --configuration Release --no-build --verbosity normal

  docker-build-push:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: MinecraftSkins.WebAPI/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/minecraft-skins:latest
            ${{ secrets.DOCKER_USERNAME }}/minecraft-skins:${{ github.sha }}

  deploy:
    needs: docker-build-push
    runs-on: self-hosted
    concurrency:
      group: minecraftskins-production-deploy
      cancel-in-progress: false
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}
      MCS_POSTGRES_PASSWORD: ${{ secrets.MCS_POSTGRES_PASSWORD }}
      MCS_ADMIN_API_KEY: ${{ secrets.MCS_ADMIN_API_KEY }}
      MCS_ADMIN_USER_ID: ${{ secrets.MCS_ADMIN_USER_ID }}
      MCS_DEMO_USER_API_KEY: ${{ secrets.MCS_DEMO_USER_API_KEY }}
      MCS_DEMO_USER_ID: ${{ secrets.MCS_DEMO_USER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        run: |
          test -n "$DOCKER_USERNAME" || { echo "DOCKER_USERNAME is required" >&2; exit 1; }
          test -n "$MCS_POSTGRES_PASSWORD" || { echo "MCS_POSTGRES_PASSWORD is required" >&2; exit 1; }
          for key_name in MCS_ADMIN_API_KEY MCS_DEMO_USER_API_KEY; do
            key_value="${!key_name}"
            if [ "${#key_value}" -lt 32 ]; then
              echo "$key_name must contain at least 32 bytes" >&2
              exit 1
            fi
          done

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull and restart
        run: |
          docker compose --project-name minecraftskins -f "$GITHUB_WORKSPACE/docker-compose.yml" config --quiet
          docker compose --project-name minecraftskins -f "$GITHUB_WORKSPACE/docker-compose.yml" pull
          docker compose --project-name minecraftskins -f "$GITHUB_WORKSPACE/docker-compose.yml" build nginx
          docker compose --project-name minecraftskins -f "$GITHUB_WORKSPACE/docker-compose.yml" up -d --no-build --remove-orphans

      - name: Verify deployment
        run: |
          for attempt in $(seq 1 24); do
            if curl --insecure --fail --silent --show-error https://127.0.0.1/health; then
              echo "Deployment verified successfully"
              exit 0
            fi
            sleep 5
          done
          docker compose --project-name minecraftskins -f "$GITHUB_WORKSPACE/docker-compose.yml" ps
          docker compose --project-name minecraftskins -f "$GITHUB_WORKSPACE/docker-compose.yml" logs --tail=100
          echo "Deployment health check failed after 120 seconds" >&2
          exit 1
