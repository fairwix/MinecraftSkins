name: CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --verbosity normal

  docker-build-push:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: MinecraftSkins.WebAPI/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/minecraft-skins:latest
            ${{ secrets.DOCKER_USERNAME }}/minecraft-skins:${{ github.sha }}
      - name: Notify
        run: echo "Image published to Docker Hub"

  deploy:
    needs: docker-build-push
    runs-on: self-hosted
    steps:
      - name: Pull and restart
        run: |
          cd /Users/juliasmirnova/MinecraftSkins
          docker compose pull
          docker compose up -d
          - name: Verify deployment
            run: |
              sleep 15
              curl -f http://localhost/health || exit 1

              ERROR_RATE=$(curl -s "http://localhost:9090/api/v1/query" \
                --data-urlencode 'query=rate(http_requests_received_total{status=~"5.."}[1m])' \
                | jq -r '.data.result[0].value[1] // "0"')

              echo "5xx error rate: $ERROR_RATE"

              if (( $(echo "$ERROR_RATE > 0.05" | bc -l) )); then
                echo "Error rate too high, deployment failed"
                exit 1
              fi

              echo "Deployment verified successfully"